<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2a3550" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>HALL PASS</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Link previews (Open Graph / X): absolute URLs, the live site. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HALL PASS" />
    <meta property="og:description" content="Three minutes until the bell. No hall pass. A procedural stealth comedy you play in the browser." />
    <meta property="og:url" content="https://hall-pass1.netlify.app/" />
    <meta property="og:image" content="https://hall-pass1.netlify.app/cover-art.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://hall-pass1.netlify.app/cover-art.jpg" />
    <meta name="description" content="Three minutes until the bell. No hall pass. One very confiscated phone." />
    <style>
      /* Full-screen, no scroll, no zoom, no text selection (docs/ARCHITECTURE.md §7 DOM layering). */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #2a3550;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      /* Layers inside #app: canvas → .hp-touch (z 2) → .hp-ui (z 3). */
      #app {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #2a3550;
        touch-action: none;
        contain: strict;
      }
      #app > canvas {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 0;
        outline: none;
      }
      .hp-fatal { position: fixed; inset: 0; display: grid; place-content: center; gap: 10px; padding: 24px;
        text-align: center; color: #f4f1ea; font: 700 18px/1.4 system-ui, sans-serif; background: #2a3550; }
      .hp-fatal strong { font-size: 22px; }
      .hp-fatal p { margin: 0; max-width: 34em; font-weight: 500; opacity: 0.9; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript style="color: #f4f1ea; font: 700 18px system-ui, sans-serif; padding: 24px; display: block">
      HALL PASS needs JavaScript and WebGL to run.
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
